name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lab7/my-app/package-lock.json

      - name: Build lab7 React app
        working-directory: lab7/my-app
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Build lab8 Vite app
        working-directory: lab8/my-app
        run: |
          npm install
          npm run build

      - name: Assemble site (all labs + built lab7 + built lab8)
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' \
                --exclude='lab7/my-app' --exclude='lab8/my-app' ./ _site/
          mkdir -p _site/lab7/my-app
          cp -r lab7/my-app/build/. _site/lab7/my-app/
          mkdir -p _site/lab8/my-app
          cp -r lab8/my-app/dist/. _site/lab8/my-app/

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
