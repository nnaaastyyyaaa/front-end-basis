name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lab7/my-app/package-lock.json

      - name: Build lab7 React app
        working-directory: lab7/my-app
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Assemble site (all labs + built lab7)
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' \
                --exclude='lab7/my-app' ./ _site/
          mkdir -p _site/lab7/my-app
          cp -r lab7/my-app/build/. _site/lab7/my-app/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
