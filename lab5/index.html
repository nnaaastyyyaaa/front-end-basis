<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>Андрієнко А.В. ІМ-42, ЛР №5, Варіант 3</title>
  </head>
  <body>
    <form action="" class="form">
      <h class="form-title">Заповніть форму</h>
      <input type="text" class="form-name" required placeholder="ПІБ" />
      <input
        type="text"
        class="form-phone"
        required
        placeholder="Номер телефону"
      />
      <input type="text" class="form-card" required placeholder="ID card" />
      <input
        type="text"
        class="form-faculty"
        required
        placeholder="Факультет"
      />
      <input
        type="text"
        class="form-birth"
        required
        placeholder="Дата народження"
      />
      <button class="form-button invalid" disabled="true">Підтвердити</button>
    </form>
    <div class="inserted-data hidden">
      <h2 class="inserted-data-title">Введені дані:</h2>
    </div>
    <table class="table">
      <tr>
        <td>1</td>
        <td>2</td>
        <td>3 <input class="color-picker" type="color" /></td>

        <td>5</td>
        <td>6</td>

        <td>7</td>

        <td>13</td>

        <td>15</td>
        <td>16</td>
        <td>17</td>
        <td>18</td>
      </tr>
      <tr>
        <td>19</td>
        <td>20</td>
        <td>21</td>
        <td>22</td>
        <td>23</td>
        <td>24</td>
      </tr>
      <tr>
        <td>25</td>
        <td>26</td>
        <td>27</td>
        <td>28</td>
        <td>29</td>
        <td>30</td>
      </tr>
      <tr>
        <td>31</td>
        <td>32</td>
        <td>33</td>
        <td>34</td>
        <td>35</td>
        <td>36</td>
      </tr>
    </table>
    <input type="color" />
  </body>
  <script src="./script.js"></script>
</html>
